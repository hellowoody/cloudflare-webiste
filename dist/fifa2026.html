<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 世界杯预测器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px}
.app{max-width:820px;margin:0 auto;padding:10px}
h1{font-size:18px;font-weight:500;text-align:center;margin-bottom:3px}
.sub{font-size:12px;color:#666;text-align:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;font-size:13px;border:1px solid #ccc;border-radius:20px;cursor:pointer;white-space:nowrap;background:#fff;color:#666;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.section{display:none}.section.active{display:block}
.info-box{background:#f0eeeb;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#555;line-height:1.6}
.info-box strong{color:#1a1a1a}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
@media(max-width:420px){.groups-grid{grid-template-columns:repeat(2,1fr);gap:6px}}
.group-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:8px 10px}
.group-title{font-size:11px;font-weight:500;color:#888;margin-bottom:6px;letter-spacing:.4px}
.team-row{display:flex;align-items:center;gap:5px;padding:3px 2px;border-radius:6px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.team-row.dragging{opacity:.35}
.team-row.drag-over{background:#f0eeeb}
.rank-badge{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;flex-shrink:0}
.r1{background:#F9C74F33;color:#a07800}.r2{background:#90E0EF33;color:#0066aa}.r3{background:#C77DFF33;color:#6600bb}.r4{background:#88888822;color:#999}
.team-fl{font-size:12px;line-height:1}.team-nm{font-size:11px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-cd{font-size:9px;color:#aaa;font-family:monospace}.dh{font-size:11px;color:#ccc;flex-shrink:0}

/* thirds */
.third-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
@media(max-width:420px){.third-grid{grid-template-columns:repeat(2,1fr)}}
.third-item{display:flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid #e5e5e5;border-radius:8px;font-size:12px;background:#fff;transition:border-color .15s,background .15s,opacity .15s}
.third-item.available{cursor:pointer}
.third-item.available:hover{border-color:#bbb;background:#fafafa}
.third-item.sel{border-color:#0077b6;background:#e8f4fb;cursor:pointer}
.third-item.sel:hover{background:#d4ecf7}
.third-item.disabled{opacity:.38;cursor:not-allowed;background:#f9f9f9}
.chk{width:15px;height:15px;border:1px solid #ccc;border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px}
.third-item.sel .chk{background:#0077b6;border-color:#0077b6;color:#fff}
.third-item.disabled .chk{background:#e5e5e5;border-color:#e5e5e5}
.t-body{flex:1;min-width:0}
.t-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.t-meta{font-size:10px;color:#aaa;margin-top:1px}
.t-why{font-size:10px;color:#c0392b;margin-top:2px;line-height:1.3}

.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:13px;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
.btn.pri{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.badge-cnt{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:500;background:#f0eeeb;color:#666}
.badge-cnt.ok{background:#e8f4fb;color:#0066aa}

/* bracket */
.bracket-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -10px;padding:0 10px 8px}
.bracket{display:flex;min-width:660px;gap:0}
.rcol{display:flex;flex-direction:column;flex:1;min-width:0}
.rlabel{font-size:9px;color:#aaa;text-align:center;padding:3px 2px 6px;font-weight:500;letter-spacing:.3px}
.mcol{display:flex;flex-direction:column;flex:1;justify-content:space-around;gap:3px;padding:0 2px}
.mbox{border:1px solid #e5e5e5;border-radius:8px;background:#fff;overflow:hidden}
.mid-label{font-size:8px;color:#aaa;padding:2px 5px;background:#f5f5f5;border-bottom:1px solid #eee}
.mteam{padding:4px 5px;display:flex;align-items:center;gap:4px;min-height:24px;cursor:pointer;transition:background .1s}
.mteam:hover{background:#f5f5f5}
.mteam+.mteam{border-top:1px solid #eee}
.mteam.win{background:#e8f4fb;font-weight:500}
.mteam.win:hover{background:#d4ecf7}
.mfl{font-size:11px;line-height:1;flex-shrink:0}.mtn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.wtick{font-size:9px;color:#0077b6;flex-shrink:0}
.conn{display:flex;flex-direction:column;justify-content:center;align-items:center;width:8px;flex-shrink:0}
.conn-ln{flex:1;width:1px;background:#e5e5e5}
.winner-box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:20px;text-align:center;margin-top:12px}
.trophy-big{font-size:36px;margin-bottom:6px}.win-flag{font-size:32px;margin-bottom:4px}
.win-name{font-size:22px;font-weight:500;margin-bottom:4px}.win-sub{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="app">
<h1>🏆 2026 世界杯预测器</h1>
<p class="sub">设置小组名次 → 选最佳第三名 → 推演淘汰赛</p>
<div class="tabs">
  <div class="tab active" onclick="switchTab('groups')">① 小组排名</div>
  <div class="tab" onclick="switchTab('thirds')">② 最佳第三名</div>
  <div class="tab" onclick="switchTab('bracket')">③ 淘汰赛</div>
</div>

<div id="tab-groups" class="section active">
  <div class="info-box">拖拽排列每组4支队伍（第1行=第一名，第4行=第四名）。前三名进入淘汰赛。</div>
  <div class="groups-grid" id="groups-container"></div>
  <div class="actions"><div class="btn pri" onclick="switchTab('thirds')">下一步：选最佳第三名 →</div></div>
</div>

<div id="tab-thirds" class="section">
  <div class="info-box">
    从12支第三名中选恰好 <strong>8支</strong>。系统会自动灰显「无论如何都无法凑齐完整匹配」的选项，确保淘汰赛每场都有对手。
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <span style="font-size:13px;font-weight:500">各组第三名</span>
    <span class="badge-cnt" id="third-count">已选 0/8</span>
  </div>
  <div class="third-grid" id="thirds-container"></div>
  <div id="thirds-hint" style="font-size:11px;color:#888;margin-top:8px;line-height:1.5"></div>
  <div class="actions">
    <div class="btn" onclick="switchTab('groups')">← 返回</div>
    <div class="btn pri" onclick="goToBracket()">生成淘汰赛 →</div>
  </div>
</div>

<div id="tab-bracket" class="section">
  <div class="info-box">直接点击球队行选为晋级（蓝色高亮=已晋级），再次点击可取消。</div>
  <div class="bracket-wrap"><div class="bracket" id="bracket-view"></div></div>
  <div id="winner-display"></div>
  <div class="actions">
    <div class="btn" onclick="switchTab('thirds')">← 修改第三名</div>
    <div class="btn" onclick="resetBracket()">重置</div>
  </div>
</div>
</div>

<script>
const GROUPS={A:["墨西哥|MEX","南非|RSA","韩国|KOR","捷克|CZE"],B:["加拿大|CAN","波黑|BIH","卡塔尔|QAT","瑞士|SUI"],C:["巴西|BRA","摩洛哥|MAR","海地|HAI","苏格兰|SCO"],D:["美国|USA","巴拉圭|PAR","澳大利亚|AUS","土耳其|TUR"],E:["德国|GER","库拉索|CUW","科特迪瓦|CIV","厄瓜多尔|ECU"],F:["荷兰|NED","日本|JPN","瑞典|SWE","突尼斯|TUN"],G:["比利时|BEL","埃及|EGY","伊朗|IRN","新西兰|NZL"],H:["西班牙|ESP","佛得角|CPV","沙特阿拉伯|KSA","乌拉圭|URU"],I:["法国|FRA","塞内加尔|SEN","伊拉克|IRQ","挪威|NOR"],J:["阿根廷|ARG","阿尔及利亚|ALG","奥地利|AUT","约旦|JOR"],K:["葡萄牙|POR","刚果民主共和国|COD","乌兹别克斯坦|UZB","哥伦比亚|COL"],L:["英格兰|ENG","克罗地亚|CRO","加纳|GHA","巴拿马|PAN"]};
const FLAGS={MEX:"🇲🇽",RSA:"🇿🇦",KOR:"🇰🇷",CZE:"🇨🇿",CAN:"🇨🇦",BIH:"🇧🇦",QAT:"🇶🇦",SUI:"🇨🇭",BRA:"🇧🇷",MAR:"🇲🇦",HAI:"🇭🇹",SCO:"sc",USA:"🇺🇸",PAR:"🇵🇾",AUS:"🇦🇺",TUR:"🇹🇷",GER:"🇩🇪",CUW:"🇨🇼",CIV:"🇨🇮",ECU:"🇪🇨",NED:"🇳🇱",JPN:"🇯🇵",SWE:"🇸🇪",TUN:"🇹🇳",BEL:"🇧🇪",EGY:"🇪🇬",IRN:"🇮🇷",NZL:"🇳🇿",ESP:"🇪🇸",CPV:"🇨🇻",KSA:"🇸🇦",URU:"🇺🇾",FRA:"🇫🇷",SEN:"🇸🇳",IRQ:"🇮🇶",NOR:"🇳🇴",ARG:"🇦🇷",ALG:"🇩🇿",AUT:"🇦🇹",JOR:"🇯🇴",POR:"🇵🇹",COD:"🇨🇩",UZB:"🇺🇿",COL:"🇨🇴",ENG:"uk",CRO:"🇭🇷",GHA:"🇬🇭",PAN:"🇵🇦"};
function fl(c){return FLAGS[c]||"🏳️"}
function pt(s){const[n,c]=s.split("|");return{name:n,code:c,flag:fl(c)}}

let groupRanks={};
let selectedThirds=new Set();
let bracketWinners={};
let matchups={};
Object.keys(GROUPS).forEach(g=>groupRanks[g]=[...GROUPS[g]]);

// ── THIRD-SLOT MATCHING (匈牙利算法) ──
const THIRD_SLOTS=[
  {match:74,groups:['A','B','C','D','F']},
  {match:77,groups:['C','D','F','G','H']},
  {match:79,groups:['C','E','F','H','I']},
  {match:80,groups:['E','H','I','J','K']},
  {match:82,groups:['A','E','H','I','J']},
  {match:81,groups:['B','E','F','I','J']},
  {match:85,groups:['E','F','G','I','J']},
  {match:87,groups:['D','E','I','J','L']},
];
const N=THIRD_SLOTS.length; // 8

// 匈牙利算法：给定selected数组，返回是否能完美匹配（每个slot分到不同的组）
function hungarian(selected){
  const matchArr=new Array(N).fill(null);
  function dfs(g,vis){
    for(let i=0;i<N;i++){
      if(!vis[i]&&THIRD_SLOTS[i].groups.includes(g)){
        vis[i]=true;
        if(matchArr[i]===null||dfs(matchArr[i],vis)){matchArr[i]=g;return true;}
      }
    }
    return false;
  }
  let cnt=0;
  for(const g of selected){
    const vis=new Array(N).fill(false);
    if(dfs(g,vis))cnt++;
  }
  return cnt===Math.min(selected.length,N);
}

// 给定已选k个，判断加入候选g后是否「仍能通过继续选满8个完成完美匹配」
function canCompleteWith(selected,g){
  const next=[...selected,g];
  if(next.length===8)return hungarian(next);
  const all='ABCDEFGHIJKL'.split('');
  const remaining=all.filter(x=>!next.includes(x));
  const need=8-next.length;
  function tryFill(idx,cur){
    if(cur.length===need)return hungarian([...next,...cur]);
    if(idx>=remaining.length)return false;
    if(remaining.length-idx<need-cur.length)return false;
    return tryFill(idx+1,[...cur,remaining[idx]])||tryFill(idx+1,cur);
  }
  return tryFill(0,[]);
}

// 获取每个未选组的状态：'available' | 'disabled'
function getThirdStatus(){
  const all='ABCDEFGHIJKL'.split('');
  const result={};
  if(selectedThirds.size>=8){
    all.forEach(g=>result[g]=selectedThirds.has(g)?'sel':'disabled');
    return result;
  }
  all.forEach(g=>{
    if(selectedThirds.has(g)){result[g]='sel';return;}
    result[g]=canCompleteWith([...selectedThirds],g)?'available':'disabled';
  });
  return result;
}

// 计算当前选定的实际匹配分配（用于展示）
function computeAssignment(selected){
  const matchArr=new Array(N).fill(null);
  function dfs(g,vis){
    for(let i=0;i<N;i++){if(!vis[i]&&THIRD_SLOTS[i].groups.includes(g)){vis[i]=true;if(matchArr[i]===null||dfs(matchArr[i],vis)){matchArr[i]=g;return true;}}}
    return false;
  }
  for(const g of selected){const vis=new Array(N).fill(false);dfs(g,vis);}
  return matchArr;
}

// ── GROUPS ──
function renderGroups(){
  const c=document.getElementById('groups-container');c.innerHTML='';
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const card=document.createElement('div');card.className='group-card';
    card.innerHTML=`<div class="group-title">组 ${g}</div><div id="glist-${g}"></div>`;
    c.appendChild(card);renderGroupList(g);
  });
}
function renderGroupList(g){
  const list=document.getElementById('glist-'+g);if(!list)return;list.innerHTML='';
  groupRanks[g].forEach((t,i)=>{
    const team=pt(t);const row=document.createElement('div');
    row.className='team-row';row.dataset.g=g;row.dataset.i=i;row.setAttribute('draggable','true');
    const rcls=i<3?'r'+(i+1):'r4';
    row.innerHTML=`<span class="rank-badge ${rcls}">${i+1}</span><span class="team-fl">${team.flag}</span><span class="team-nm">${team.name}</span><span class="team-cd">${team.code}</span><span class="dh">⠿</span>`;
    addDrag(row,g);list.appendChild(row);
  });
}
function addDrag(row,g){
  let di=null;
  row.addEventListener('dragstart',e=>{di=+e.currentTarget.dataset.i;e.currentTarget.classList.add('dragging');});
  row.addEventListener('dragend',e=>e.currentTarget.classList.remove('dragging'));
  row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('drag-over');});
  row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
  row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('drag-over');const ti=+row.dataset.i;if(di===null||di===ti)return;const arr=[...groupRanks[g]];const[m]=arr.splice(di,1);arr.splice(ti,0,m);groupRanks[g]=arr;renderGroupList(g);di=null;});
  let tsi=null,tsy=0;
  row.addEventListener('touchstart',e=>{tsi=+row.dataset.i;tsy=e.touches[0].clientY;row.classList.add('dragging');},{passive:true});
  row.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientY-tsy)>15)e.preventDefault();},{passive:false});
  row.addEventListener('touchend',e=>{
    row.classList.remove('dragging');
    const el=document.elementFromPoint(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
    if(!el)return;const target=el.closest('.team-row');
    if(!target||target.dataset.g!==g)return;
    const ti=+target.dataset.i;if(tsi===null||tsi===ti)return;
    const arr=[...groupRanks[g]];const[m]=arr.splice(tsi,1);arr.splice(ti,0,m);groupRanks[g]=arr;renderGroupList(g);tsi=null;
  });
}

// ── THIRDS ──
function renderThirds(){
  const status=getThirdStatus();
  const c=document.getElementById('thirds-container');c.innerHTML='';
  'ABCDEFGHIJKL'.split('').forEach(g=>{
    const t=pt(groupRanks[g][2]);
    const s=status[g];
    const isSel=s==='sel';
    const isDisabled=s==='disabled';
    const div=document.createElement('div');
    div.className='third-item '+(isSel?'sel':isDisabled?'disabled':'available');

    // 找出该组第三名可以参加哪些场次
    const slots=THIRD_SLOTS.filter(sl=>sl.groups.includes(g)).map(sl=>'M'+sl.match);
    const slotStr=slots.join('、');

    div.innerHTML=`
      <span class="chk">${isSel?'✓':isDisabled?'×':''}</span>
      <span style="font-size:14px;line-height:1;flex-shrink:0">${t.flag}</span>
      <span class="t-body">
        <div class="t-name">${t.name}</div>
        <div class="t-meta">组${g}·${t.code}${slots.length?'　'+slotStr:''}</div>
        ${isDisabled&&!isSel?`<div class="t-why">选入后无法完成匹配</div>`:''}
      </span>`;
    if(!isDisabled){div.onclick=()=>toggleThird(g);}
    c.appendChild(div);
  });
  updateThirdCount();

  // 提示信息
  const hint=document.getElementById('thirds-hint');
  if(selectedThirds.size===8){
    hint.textContent='✓ 已选满8支，匹配完成。';hint.style.color='#0077b6';
  }else{
    const disabled=Object.values(getThirdStatus()).filter(s=>s==='disabled').length;
    hint.textContent=disabled>0?`灰色队伍（${disabled}支）加入后会导致某场32强无法配对，已自动锁定。`:'';
    hint.style.color='#888';
  }
}
function toggleThird(key){
  if(selectedThirds.has(key)){selectedThirds.delete(key);}
  else{if(selectedThirds.size>=8){alert('已选满8支！');return;}selectedThirds.add(key);}
  renderThirds();
}
function updateThirdCount(){
  const el=document.getElementById('third-count');el.textContent=`已选 ${selectedThirds.size}/8`;
  el.className='badge-cnt'+(selectedThirds.size===8?' ok':'');
}
function goToBracket(){
  if(selectedThirds.size!==8){alert(`请选择恰好8支第三名（当前${selectedThirds.size}支）`);return;}
  switchTab('bracket');
}

// ── BRACKET ──
function getT(g,r){return pt(groupRanks[g][r-1]);}
function buildMatchups(){
  // 用匈牙利算法结果确定哪个第三名去哪场
  const assignment=computeAssignment([...selectedThirds]);
  // assignment[i] = 第i个slot分配到的组，null表示未分配
  function getThirdForSlot(matchId){
    const idx=THIRD_SLOTS.findIndex(s=>s.match===matchId);
    const g=idx>=0?assignment[idx]:null;
    if(g){const t=pt(groupRanks[g][2]);return t;}
    return{name:'TBD',code:'TBD',flag:'❓'};
  }
  return{
    73:{home:getT('A',2),away:getT('B',2)},
    74:{home:getT('E',1),away:getThirdForSlot(74)},
    75:{home:getT('F',1),away:getT('C',2)},
    76:{home:getT('C',1),away:getT('F',2)},
    77:{home:getT('I',1),away:getThirdForSlot(77)},
    78:{home:getT('E',2),away:getT('I',2)},
    79:{home:getT('A',1),away:getThirdForSlot(79)},
    80:{home:getT('L',1),away:getThirdForSlot(80)},
    81:{home:getT('D',1),away:getThirdForSlot(81)},
    82:{home:getT('G',1),away:getThirdForSlot(82)},
    83:{home:getT('K',2),away:getT('L',2)},
    84:{home:getT('H',1),away:getT('J',2)},
    85:{home:getT('B',1),away:getThirdForSlot(85)},
    86:{home:getT('J',1),away:getT('H',2)},
    87:{home:getT('K',1),away:getThirdForSlot(87)},
    88:{home:getT('D',2),away:getT('G',2)},
  };
}
const DEPS={89:[73,75],90:[74,77],91:[76,78],92:[79,80],93:[83,84],94:[81,82],95:[86,88],96:[85,87],97:[89,90],98:[93,94],99:[91,92],100:[95,96],101:[97,98],102:[99,100],104:[101,102]};
function renderBracket(){matchups=buildMatchups();bracketWinners={};propagateAll();drawBracket();}
function resetBracket(){bracketWinners={};propagateAll();drawBracket();document.getElementById('winner-display').innerHTML='';}
function propagateAll(){[89,90,91,92,93,94,95,96,97,98,99,100,101,102,104].forEach(mid=>{const[d1,d2]=DEPS[mid];if(!matchups[mid])matchups[mid]={};matchups[mid].home=bracketWinners[d1]||{name:'TBD',code:'TBD',flag:'❓'};matchups[mid].away=bracketWinners[d2]||{name:'TBD',code:'TBD',flag:'❓'};});}
function drawBracket(){
  const v=document.getElementById('bracket-view');v.innerHTML='';
  function mkBox(id){
    const m=matchups[id]||{home:{name:'TBD',flag:'❓',code:'TBD'},away:{name:'TBD',flag:'❓',code:'TBD'}};
    const w=bracketWinners[id];
    const div=document.createElement('div');div.className='mbox';
    div.innerHTML=`<div class="mid-label">M${id}</div>`;
    [m.home,m.away].forEach(t=>{
      const isWin=w&&t&&w.code===t.code&&w.code!=='TBD';
      const row=document.createElement('div');row.className='mteam'+(isWin?' win':'');
      row.innerHTML=`<span class="mfl">${t?t.flag:'❓'}</span><span class="mtn">${t?t.name:'TBD'}</span>${isWin?'<span class="wtick">✓</span>':''}`;
      if(t&&t.code!=='TBD'){row.onclick=()=>{bracketWinners[id]&&bracketWinners[id].code===t.code?delete bracketWinners[id]:bracketWinners[id]=t;propagateAll();drawBracket();const fw=bracketWinners[104];document.getElementById('winner-display').innerHTML=fw&&fw.code!=='TBD'?`<div class="winner-box"><div class="trophy-big">🏆</div><div class="win-flag">${fw.flag}</div><div class="win-name">${fw.name}</div><div class="win-sub">2026 FIFA 世界杯冠军</div></div>`:'';};}
      div.appendChild(row);
    });
    return div;
  }
  function col(label,ids){const d=document.createElement('div');d.className='rcol';d.innerHTML=`<div class="rlabel">${label}</div>`;const mc=document.createElement('div');mc.className='mcol';ids.forEach(id=>mc.appendChild(mkBox(id)));d.appendChild(mc);return d;}
  function conn(){const d=document.createElement('div');d.className='conn';d.innerHTML='<div class="conn-ln"></div>';return d;}
  v.appendChild(col('32强',[73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88]));
  v.appendChild(conn());v.appendChild(col('16强',[89,90,91,92,93,94,95,96]));
  v.appendChild(conn());v.appendChild(col('八强',[97,98,99,100]));
  v.appendChild(conn());v.appendChild(col('四强',[101,102]));v.appendChild(conn());
  const fc=document.createElement('div');fc.className='rcol';fc.innerHTML='<div class="rlabel">决赛</div>';
  const fm=document.createElement('div');fm.className='mcol';fm.appendChild(mkBox(104));fc.appendChild(fm);v.appendChild(fc);
}
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['groups','thirds','bracket'][i]===name));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='thirds')renderThirds();
  if(name==='bracket')renderBracket();
}
renderGroups();
</script>
